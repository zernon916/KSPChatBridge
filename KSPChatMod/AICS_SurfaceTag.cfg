// AICS surface role on every control surface (incl. stock airbrakes): SPH right-click -> AICS role
@PART[*]:HAS[@MODULE[ModuleControlSurface]]:FOR[KSPChatBridge] { MODULE { name = AicsSurfaceTag } }
@PART[*]:HAS[@MODULE[ModuleAeroSurface],!MODULE[ModuleControlSurface]]:FOR[KSPChatBridge] { MODULE { name = AicsSurfaceTag } }
