// Native AICS MFD in stock cockpits (no RasterPropMonitor needed; RPM pages in AICS_RPM.cfg still work alongside).
// The AICS_MFD prop borrows the stock monitor model only as a host (hidden); the face, keys and screen are built in code.
// (Mk1 cockpit, Mk1-3 pod, Mk2 cockpit: see AICS_IVA_Standalone.cfg when RPM is absent.) Mk2 inline: replaces the stock docking monitor at its spot. Others: new spot (positions are tunable here;
// flipX / flipY on the module fix a mirrored or upside-down face, width / height in metres).
PROP
{
    name = AICS_MFD
    MODEL
    {
        model = Squad/Props/Monitor/MonitorDockingMode
    }
    MODULE
    {
        name = AicsIvaMfd
        width = 0.20
        height = 0.1625
        refreshHz = 4
    }
}


@INTERNAL[mk2InlineInternal]:FOR[KSPChatBridge]
{
    !PROP:HAS[#name[MonitorDockingMode]] {}
    PROP
    {
        name = AICS_MFD
        position = 0,0.5942,-0.0062
        rotation = 0.5000001,0,0,0.8660254
        scale = 1.1,1.1,1.1
    }
}



@INTERNAL[mk1InlineInternal]:FOR[KSPChatBridge]
{
    PROP
    {
        name = AICS_MFD
        position = 0.30,0.59,-0.54
        rotation = 0.6293204,0,0,0.777146
        scale = 0.8,0.8,0.8
    }
}
// ---- RasterPropMonitor: ONE generic patch (Luke 6:17 PM). Every RasterPropMonitorBasicMFD in every interior gets the AICS
// screen on top of it; at runtime RPM's screen is hidden (unless Settings > "RPM MFD screens: KEEP RPM"), the face is oriented
// toward the pilot and sized to RPM's screen, and each screen opens its own default page (MAP / ILS / AP / CHART / COMMS).
@PROP[RasterPropMonitorBasicMFD]:NEEDS[RasterPropMonitor]:FINAL
{
    MODULE
    {
        name = AicsIvaMfd
        rpmHost = true
        autoOrient = true
        autoSize = true
        hideModel = false
        refreshHz = 4
        // fill RPM's whole glass opening (multiples of the inner FlatMon40x10Screen rect; offsets + = right / up)
        glassScaleX = 1.30
        glassScaleY = 1.12
        glassOffsetX = 0.10
        glassOffsetY = 0.07
    }
}
