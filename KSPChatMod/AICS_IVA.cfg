// Native AICS MFD in stock cockpits (no RasterPropMonitor needed; RPM pages in AICS_RPM.cfg still work alongside).
// The AICS_MFD prop borrows the stock monitor model only as a host (hidden); the face, keys and screen are built in code.
// Mk1 cockpit and Mk2 inline: replaces the stock docking monitor at its spot. Others: new spot (positions are tunable here;
// flipX / flipY on the module fix a mirrored or upside-down face, width / height in metres).
PROP
{
    name = AICS_MFD
    MODEL
    {
        model = Squad/Props/Monitor/MonitorDockingMode
    }
    MODULE
    {
        name = AicsIvaMfd
        width = 0.20
        height = 0.1625
        refreshHz = 4
    }
}

@INTERNAL[mk1CockpitInternal]:FOR[KSPChatBridge]
{
    !PROP:HAS[#name[MonitorDockingMode]] {}
    PROP
    {
        name = AICS_MFD
        position = 0,0.09078927,-0.8965402
        rotation = 0.6087615,0,0,0.7933533
        scale = 1,1,1
    }
}

@INTERNAL[mk2InlineInternal]:FOR[KSPChatBridge]
{
    !PROP:HAS[#name[MonitorDockingMode]] {}
