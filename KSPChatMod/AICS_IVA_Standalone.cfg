// Standalone AICS IVA layout for players WITHOUT RasterPropMonitor (Luke 5:54 PM): one AICS_MFD_RPMPOS at every spot where
// RPM puts a RasterPropMonitorBasicMFD, coordinates copied from JSI RPMPodPatches (RPM 1.12.5 build). Does not need RPM files.
// Note: RPM's "remade" interiors use their own panel models, so in stock interiors a screen can sit slightly off the panel.
PROP
{
    name = AICS_MFD_RPMPOS
    MODEL
    {
        model = Squad/Props/Monitor/MonitorDockingMode
    }
    MODULE
    {
        name = AicsIvaMfd
        autoOrient = true
        width = 0.30
        height = 0.24
        refreshHz = 4
    }
}

