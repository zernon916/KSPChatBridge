// Optional IVA pages for RasterPropMonitor (works only if RPM is installed; no hard dependency).
// Adds "AICS ILS" and "AICS MAP" pages to every RPM screen prop. Page cycling uses the MFD's next/prev page buttons.
@PROP[*]:HAS[@MODULE[RasterPropMonitor]]:NEEDS[RasterPropMonitor]:AFTER[RasterPropMonitor]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = aicsIls
            PAGEHANDLER
            {
                name = AicsRpmPages
                method = IlsPage
            }
        }
        PAGE
        {
            name = aicsMap
            PAGEHANDLER
            {
                name = AicsRpmPages
                method = MapPage
                spanKm = 20
            }
        }
    }
}

