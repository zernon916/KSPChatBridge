// Optional IVA pages for RasterPropMonitor (works only if RPM is installed; no hard dependency).
// Adds AICS ILS / AICS MAP / AICS AUTOPILOT pages to every RPM screen prop. On the stock RPM MFD (MFD40x20, used by the
// Mk1 cockpit / Mk2 inline etc.) they sit on the free right-column soft key R8: press R8 to open AICS ILS, press again
// to cycle MAP -> AUTOPILOT status -> ILS (pages sharing one button cycle in RPM).
@PROP[*]:HAS[@MODULE[RasterPropMonitor]]:NEEDS[RasterPropMonitor]:AFTER[RasterPropMonitor]
{
    @MODULE[RasterPropMonitor]
    {
        PAGE
        {
            name = aicsIls
            button = buttonR8
            PAGEHANDLER
            {
                name = AicsRpmPages
                method = IlsPage
            }
        }
        PAGE
        {
            name = aicsMap
            button = buttonR8
            PAGEHANDLER
            {
                name = AicsRpmPages
                method = MapPage
                spanKm = 20
            }
        }
        PAGE
        {
            name = aicsStatus
            button = buttonR8
            PAGEHANDLER
            {
                name = AicsRpmPages
                method = StatusPage
            }
        }
    }
}